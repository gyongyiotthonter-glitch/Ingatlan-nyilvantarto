<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingatlan Nyilvántartó</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b;}
button,input,select,textarea{font-family:inherit;}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.12)!important;}
.tab-btn{padding:.45rem .85rem;background:none;border:none;border-bottom:3px solid transparent;color:#64748b;cursor:pointer;font-weight:400;white-space:nowrap;margin-bottom:-2px;font-size:.83rem;}
.tab-btn.active{color:#1a3a6b;font-weight:700;border-bottom-color:#1a3a6b;}
.inp{width:100%;padding:.45rem .6rem;border:1px solid #d1d5db;border-radius:.4rem;font-size:.88rem;}
.btn-primary{padding:.6rem 1.75rem;background:#1a3a6b;color:white;border:none;border-radius:.5rem;cursor:pointer;font-weight:700;}
.btn-sec{padding:.6rem 1.5rem;background:white;border:1px solid #d1d5db;border-radius:.5rem;cursor:pointer;font-weight:600;}
.badge{padding:.18rem .7rem;border-radius:1rem;font-size:.75rem;font-weight:700;color:white;}
.info-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:.5rem;padding:.45rem .65rem;}
.info-box .lbl{font-size:.68rem;color:#64748b;}
.info-box .val{font-weight:700;color:#1a3a6b;font-size:.82rem;margin-top:.1rem;word-break:break-word;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SURL='https://ckdfmzeanmnwwrkhhzop.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrZGZtemVhbm1ud3dya2hoem9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2Mzc1MjMsImV4cCI6MjA5MjIxMzUyM30.PaaHm1KVGlP8WB3WXnOyA__SGmvf_X6VGIHcnX7L64E';
const SH={'apikey':SKEY,'Authorization':`Bearer ${SKEY}`,'Content-Type':'application/json'};
const TYPES=['Ház','Lakás','Zártkerti ingatlan','Telek','Üzleti ingatlan','Egyéb'];
const SUBTYPES={'Ház':['Családi ház','Ikerház','Sorház','Nyaraló','Kastély','Tanya','Egyéb'],'Lakás':['Panel lakás','Tégla lakás','Újépítésű lakás','Loft','Penthouse','Egyéb'],'Zártkerti ingatlan':['Zártkerti kisház','Gazdasági épület','Présház','Pince','Egyéb'],'Telek':['Építési telek','Zártkert','Mezőgazdasági terület','Erdő','Egyéb'],'Üzleti ingatlan':['Iroda','Üzlethelyiség','Raktár','Ipari ingatlan','Vendéglátó egység','Egyéb'],'Egyéb':['Egyéb']};
const DOC_TYPES=['Megbízási szerződés','Megtekintési nyilatkozat','Adatfelvételi lap','Tulajdoni lap','Térképmásolat','Adatkezelési nyilatkozat','Egyéb'];

const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const fmtD=d=>d?new Date(d).toLocaleDateString('hu-HU'):'–';
const fmtDT=d=>d?new Date(d).toLocaleString('hu-HU',{dateStyle:'short',timeStyle:'short'}):'–';
const fmtAr=n=>n?Number(n).toLocaleString('hu-HU')+' Ft':'–';
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sc=s=>({Aktív:'#22c55e',Függőben:'#f59e0b',Lezárva:'#94a3b8'}[s]||'#94a3b8');

// STATE
let S={
  user:localStorage.getItem('in_user')||'',
  section:'prop',loading:true,saving:false,toast:'',
  props:[],kers:[],
  pView:'list',pCur:null,pForm:null,pTab:'alap',pSearch:'',pSf:'',
  teendok:[],erdeklodok:[],propNaplo:[],taskEdits:{},erdEdits:{},
  kView:'list',kCur:null,kForm:null,kTab:'alap',kSearch:'',kSf:'',
  kiajanlottak:[],kerNaplo:[],kaiEdits:{}
};

// DB
const db={
  get:async(t,q='')=>{try{const r=await fetch(`${SURL}/rest/v1/${t}?${q}`,{headers:SH});return r.ok?await r.json():[]}catch{return[]}},
  upsert:async(t,data)=>{try{const r=await fetch(`${SURL}/rest/v1/${t}`,{method:'POST',headers:{...SH,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(data)});if(r.ok)return{ok:true};let e=`HTTP ${r.status}`;try{const j=await r.json();e+=': '+(j.message||j.hint||JSON.stringify(j))}catch{e+=': '+await r.text()};return{ok:false,error:e}}catch(e){return{ok:false,error:e.message}}},
  del:async(t,id)=>{try{const r=await fetch(`${SURL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:SH});return r.ok}catch{return false}},
  photo:async(file,pid)=>{try{const blob=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,900/img.width),w=Math.round(img.width*sc),h=Math.round(img.height*sc),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res(b),'image/jpeg',.78)};img.onerror=rej;img.src=e.target.result};rd.onerror=rej;rd.readAsDataURL(file)});const fn=`${pid}_${uid()}.jpg`;const r=await fetch(`${SURL}/storage/v1/object/fotok/${fn}`,{method:'POST',headers:{'apikey':SKEY,'Authorization':`Bearer ${SKEY}`,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});if(r.ok)return`${SURL}/storage/v1/object/public/fotok/${fn}`;let e=`Storage HTTP ${r.status}`;try{const j=await r.json();e+=': '+(j.message||j.error||JSON.stringify(j))}catch{};return{error:e}}catch(e){return{error:e.message}}}
};

// TOAST
let toastT;
const toast=msg=>{S.toast=msg;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';const t=document.getElementById('_toast');if(t)t.remove()},3000)};

// NAPLO
const naplo=async(rid,tabla,mit)=>db.upsert('naplo',{id:uid(),tabla,rekord_id:rid,ki:S.user,mit,datum:now()});

// LOAD
const loadAll=async()=>{const[p,k]=await Promise.all([db.get('megbizasok','order=letrehozva.desc'),db.get('keresesi_megbizasok','order=letrehozva.desc')]);S.props=p;S.kers=k;S.loading=false;render()};
const loadPR=async pid=>{const[t,e,n]=await Promise.all([db.get('teendok',`megbizas_id=eq.${pid}&order=letrehozva.asc`),db.get('erdeklodok',`megbizas_id=eq.${pid}&order=letrehozva.asc`),db.get('naplo',`rekord_id=eq.${pid}&order=datum.desc`)]);S.teendok=t;S.erdeklodok=e;S.propNaplo=n;render()};
const loadKR=async kid=>{const[k,n]=await Promise.all([db.get('kiajanlottak',`ker_id=eq.${kid}&order=letrehozva.asc`),db.get('naplo',`rekord_id=eq.${kid}&order=datum.desc`)]);S.kiajanlottak=k;S.kerNaplo=n;render()};

// RENDER
const render=()=>{
  const app=document.getElementById('app');if(!app)return;
  if(!S.user){app.innerHTML=loginHTML();return}
  if(S.loading){app.innerHTML=nav()+`<div style="text-align:center;padding:4rem;color:#64748b">⏳ Betöltés...</div>`;return}
  if(S.section==='prop'){
    if(S.pView==='form')app.innerHTML=nav()+propFormHTML();
    else if(S.pView==='detail'&&S.props.find(p=>p.id===S.pCur))app.innerHTML=nav()+propDetailHTML();
    else app.innerHTML=nav()+propListHTML();
  }else{
    if(S.kView==='form')app.innerHTML=nav()+kerFormHTML();
    else if(S.kView==='detail'&&S.kers.find(k=>k.id===S.kCur))app.innerHTML=nav()+kerDetailHTML();
    else app.innerHTML=nav()+kerListHTML();
  }
  let t=document.getElementById('_toast');
  if(S.toast&&!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:1.75rem;right:1.75rem;background:#1a3a6b;color:white;padding:.7rem 1.5rem;border-radius:.75rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:9999;';document.body.appendChild(t)}
  if(t)t.textContent=S.toast;
};

const nav=()=>`<div style="background:#1a3a6b;padding:.55rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem;">
  <span style="color:white;font-weight:800;font-size:.98rem;">🏠 Ingatlan Nyilvántartó</span>
  <button onclick="go('prop')" style="padding:.32rem .9rem;background:${S.section==='prop'?'white':'transparent'};color:${S.section==='prop'?'#1a3a6b':'rgba(255,255,255,.85)'};border:1px solid rgba(255,255,255,.35);border-radius:.4rem;cursor:pointer;font-weight:600;font-size:.86rem;">📋 Eladási megbízások</button>
  <button onclick="go('ker')" style="padding:.32rem .9rem;background:${S.section==='ker'?'white':'transparent'};color:${S.section==='ker'?'#1a3a6b':'rgba(255,255,255,.85)'};border:1px solid rgba(255,255,255,.35);border-radius:.4rem;cursor:pointer;font-weight:600;font-size:.86rem;">🔍 Keresési igények</button>
  <button onclick="logout()" style="margin-left:auto;padding:.32rem .75rem;background:transparent;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.25);border-radius:.4rem;cursor:pointer;font-size:.82rem;">👤 ${esc(S.user)} · Kilépés</button>
</div>`;

const loginHTML=()=>`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a6b,#2c6fbd);">
  <div style="background:white;padding:2.5rem;border-radius:1.25rem;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);">
    <div style="font-size:3.5rem;">🏠</div>
    <h2 style="color:#1a3a6b;margin:.25rem 0 .5rem;">Ingatlan Nyilvántartó</h2>
    <p style="color:#64748b;font-size:.85rem;margin-bottom:1.5rem;">Add meg a neved a belépéshez</p>
    <input id="ln" placeholder="Pl. Gyöngyi" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:.75rem;border:2px solid #e2e8f0;border-radius:.5rem;font-size:1rem;margin-bottom:1rem;outline:none;">
    <button onclick="doLogin()" style="width:100%;padding:.75rem;background:#1a3a6b;color:white;border:none;border-radius:.5rem;font-size:1rem;cursor:pointer;font-weight:700;">Belépés →</button>
  </div>
</div>`;

// PROP LIST
const propListHTML=()=>{
  const q=S.pSearch.toLowerCase();
  const filt=S.props.filter(p=>(!q||['cim','tulajnev','referens','hrsz'].some(f=>(p[f]||'').toLowerCase().includes(q)))&&(!S.pSf||p.statusz===S.pSf));
  const stats=[['Összes',S.props.length,'#1a3a6b'],['Aktív',S.props.filter(p=>p.statusz==='Aktív').length,'#22c55e'],['Függőben',S.props.filter(p=>p.statusz==='Függőben').length,'#f59e0b'],['Lezárva',S.props.filter(p=>p.statusz==='Lezárva').length,'#94a3b8']];
  return `<div style="max-width:1100px;margin:0 auto;padding:0 1rem 2rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.65rem;">
      <h1 style="color:#1a3a6b;font-size:1.25rem;">📋 Eladási megbízások</h1>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
        <input value="${esc(S.pSearch)}" oninput="S.pSearch=this.value;render()" placeholder="🔍 Keresés..." style="padding:.42rem .7rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.88rem;width:170px;">
        <select onchange="S.pSf=this.value;render()" style="padding:.42rem .6rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.88rem;">
          <option value="">Minden státusz</option>
          ${['Aktív','Függőben','Lezárva'].map(x=>`<option value="${x}"${S.pSf===x?' selected':''}>${x}</option>`).join('')}
        </select>
        <button onclick="loadAll()" style="padding:.42rem .7rem;background:#f0f9ff;border:1px solid #bae6fd;border-radius:.5rem;cursor:pointer;">🔄</button>
        <button onclick="newProp()" style="padding:.42rem 1.2rem;background:#1a3a6b;color:white;border:none;border-radius:.5rem;cursor:pointer;font-weight:700;">+ Új megbízás</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem;margin-bottom:1rem;">
      ${stats.map(([l,n,c])=>`<div style="background:white;border:1px solid #e2e8f0;border-radius:.75rem;padding:.85rem;text-align:center;"><div style="font-size:1.75rem;font-weight:800;color:${c};">${n}</div><div style="font-size:.78rem;color:#64748b;">${l}</div></div>`).join('')}
    </div>
    ${filt.length===0?`<div style="text-align:center;padding:4rem;color:#94a3b8;"><div style="font-size:3.5rem;">🏘️</div><p>${S.props.length===0?'Még nincs megbízás.':'Nincs találat.'}</p></div>`
    :`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">${filt.map(p=>`
      <div class="card" onclick="openProp('${p.id}')" style="background:white;border:1px solid #e2e8f0;border-radius:.85rem;overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;">
        <div style="height:145px;background:#f1f5f9;position:relative;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#cbd5e1;overflow:hidden;">
          🏠${p.fofoto?`<img src="${esc(p.fofoto)}" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">`:''}
          <span style="position:absolute;top:.5rem;right:.5rem;background:${sc(p.statusz)};color:white;padding:.18rem .65rem;border-radius:1rem;font-size:.73rem;font-weight:700;">${esc(p.statusz)}</span>
        </div>
        <div style="padding:.7rem 1rem;">
          <div style="font-weight:700;color:#1a3a6b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.cim||'(Cím nélkül)')}</div>
          <div style="font-size:.77rem;color:#64748b;margin:.1rem 0 .4rem;">${esc(p.tipus||'')}${p.altipus?' · '+esc(p.altipus):''}${p.referens?' · '+esc(p.referens):''}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:800;color:#1a3a6b;">${fmtAr(p.ar)}</span>
            <span style="font-size:.73rem;color:#94a3b8;">${p.alap?'📐'+p.alap+'m²':''}${p.alap&&p.telek?' · ':''}${p.telek?'🌿'+p.telek+'m²':''}</span>
          </div>
          ${p.hrsz?`<div style="font-size:.73rem;color:#94a3b8;margin-top:.2rem;">HRSZ: ${esc(p.hrsz)}</div>`:''}
        </div>
      </div>`).join('')}</div>`}
  </div>`;
};

// PROP FORM
const propFormHTML=()=>{
  const f=S.pForm;const isNew=!S.props.find(p=>p.id===f.id);
  const subs=SUBTYPES[f.tipus]||['Egyéb'];
  const sel=(arr,val)=>arr.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('');
  return `<div style="max-width:780px;margin:0 auto;padding:0 1rem 2rem;">
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;">
      <button onclick="cancelPForm()" class="btn-sec">← Vissza</button>
      <h2 style="color:#1a3a6b;">${isNew?'🆕 Új eladási megbízás':'✏️ Szerkesztés'}</h2>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 2rem;">
      <div>
        <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">📍 Azonosítás</h4>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Cím *</label>
        <input class="inp" style="margin-bottom:.65rem;" value="${esc(f.cim)}" oninput="S.pForm.cim=this.value" placeholder="Pl. Győr, Petőfi u. 12.">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Típus</label>
        <select class="inp" style="margin-bottom:.65rem;" onchange="S.pForm.tipus=this.value;S.pForm.altipus=(SUBTYPES[this.value]||['Egyéb'])[0];render()">${sel(TYPES,f.tipus)}</select>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Altípus</label>
        <select class="inp" style="margin-bottom:.65rem;" onchange="S.pForm.altipus=this.value">${sel(subs,f.altipus)}</select>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">HRSZ</label>
        <input class="inp" style="margin-bottom:.65rem;" value="${esc(f.hrsz)}" oninput="S.pForm.hrsz=this.value" placeholder="Pl. 1234/5">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Státusz</label>
        <select class="inp" style="margin-bottom:.65rem;" onchange="S.pForm.statusz=this.value">${sel(['Aktív','Függőben','Lezárva'],f.statusz)}</select>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Referens</label>
        <input class="inp" style="margin-bottom:.65rem;" value="${esc(f.referens)}" oninput="S.pForm.referens=this.value">
        <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">💰 Ár & méretek</h4>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Kínálati ár (Ft)</label>
        <input class="inp" style="margin-bottom:.65rem;" type="number" value="${f.ar||''}" oninput="S.pForm.ar=this.value" placeholder="25000000">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Alapterület (m²)</label>
        <input class="inp" style="margin-bottom:.65rem;" type="number" value="${f.alap||''}" oninput="S.pForm.alap=this.value">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Telekterület (m²)</label>
        <input class="inp" style="margin-bottom:.65rem;" type="number" value="${f.telek||''}" oninput="S.pForm.telek=this.value">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Jutalék (%)</label>
        <input class="inp" style="margin-bottom:.65rem;" type="number" value="${f.jutalek||''}" oninput="S.pForm.jutalek=this.value" placeholder="3">
      </div>
      <div>
        <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">👤 Tulajdonos</h4>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Neve</label>
        <input class="inp" style="margin-bottom:.65rem;" value="${esc(f.tulajnev)}" oninput="S.pForm.tulajnev=this.value">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Telefon</label>
        <input class="inp" style="margin-bottom:.65rem;" type="tel" value="${esc(f.tulajtel)}" oninput="S.pForm.tulajtel=this.value">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Email</label>
        <input class="inp" style="margin-bottom:.65rem;" type="email" value="${esc(f.tulajemail)}" oninput="S.pForm.tulajemail=this.value">
        <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">📅 Megbízás</h4>
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Kezdete</label>
        <input class="inp" style="margin-bottom:.65rem;" type="date" value="${f.kezdet||''}" oninput="S.pForm.kezdet=this.value">
        <label style="display:block;font-size:.78rem;font-weight:700;color:#374151;margin-bottom:.2rem;">Lejárata (opcionális)</label>
        <input class="inp" style="margin-bottom:.65rem;" type="date" value="${f.lejarat||''}" oninput="S.pForm.lejarat=this.value">
      </div>
    </div>
    <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">⚖️ Jogi megjegyzések</h4>
    <textarea class="inp" style="margin-bottom:.65rem;resize:vertical;" rows="3" oninput="S.pForm.jogimegjegyzes=this.value">${esc(f.jogimegjegyzes)}</textarea>
    <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">📝 Hirdetési szöveg</h4>
    <textarea class="inp" style="margin-bottom:.65rem;resize:vertical;" rows="6" oninput="S.pForm.hirsz=this.value">${esc(f.hirsz)}</textarea>
    <h4 style="color:#1e4d8c;border-bottom:2px solid #e0ecff;padding-bottom:.3rem;margin:1rem 0 .4rem;font-size:.93rem;">🔗 Hirdetési linkek</h4>

// ACTIONS
const doLogin=()=>{const n=document.getElementById('ln')?.value?.trim();if(n){S.user=n;localStorage.setItem('in_user',n);render();loadAll()}};
const logout=()=>{S.user='';localStorage.removeItem('in_user');render()};
const go=sec=>{S.section=sec;S.pView='list';S.kView='list';render()};

const openProp=id=>{S.pCur=id;S.pView='detail';S.pTab='alap';S.teendok=[];S.erdeklodok=[];S.propNaplo=[];render();loadPR(id)};
const newProp=()=>{S.pForm={id:uid(),cim:'',tipus:'Ház',altipus:'Családi ház',hrsz:'',ar:'',alap:'',telek:'',tulajnev:'',tulajtel:'',tulajemail:'',kezdet:'',lejarat:'',jutalek:'',referens:S.user,statusz:'Aktív',jogimegjegyzes:'',hirsz:'',fofoto:'',drive_linkek:[],hirdetesi_linkek:[],dokumentumok:[],letrehozva:now()};S.pView='form';render()};
const editProp=()=>{const p=S.props.find(x=>x.id===S.pCur);if(p){S.pForm={...p,drive_linkek:p.drive_linkek||[],hirdetesi_linkek:p.hirdetesi_linkek||[],dokumentumok:p.dokumentumok||[]};S.pView='form';render()}};
const cancelPForm=()=>{const isNew=!S.props.find(p=>p.id===S.pForm?.id);S.pForm=null;S.pView=isNew?'list':'detail';render()};
const refreshProp=async()=>{await loadAll();await loadPR(S.pCur);toast('🔄 Frissítve')};
const refreshAll=async()=>{await loadAll();toast('🔄 Frissítve')};

const pickPhoto=input=>{const f=input.files?.[0];if(f){S.pForm._fotoFile=f;S.pForm._fotoName=f.name;render()}};

const saveProp=async()=>{
  if(!S.pForm.cim?.trim()){toast('❌ Cím megadása kötelező!');return}
  S.saving=true;render();
  const isNew=!S.props.find(p=>p.id===S.pForm.id);
  let fofoto=S.pForm.fofoto||'';
  if(S.pForm._fotoFile){
    const result=await db.photo(S.pForm._fotoFile,S.pForm.id);
    if(typeof result==='string')fofoto=result;
    else{S.saving=false;toast('❌ Fotó hiba: '+(result?.error||'ismeretlen'));return;}
  }
  const data={id:S.pForm.id,cim:S.pForm.cim,tipus:S.pForm.tipus,altipus:S.pForm.altipus,hrsz:S.pForm.hrsz||'',ar:S.pForm.ar?Number(S.pForm.ar):null,alap:S.pForm.alap?Number(S.pForm.alap):null,telek:S.pForm.telek?Number(S.pForm.telek):null,tulajnev:S.pForm.tulajnev||'',tulajtel:S.pForm.tulajtel||'',tulajemail:S.pForm.tulajemail||'',kezdet:S.pForm.kezdet||null,lejarat:S.pForm.lejarat||null,jutalek:S.pForm.jutalek?Number(S.pForm.jutalek):null,referens:S.pForm.referens||'',statusz:S.pForm.statusz||'Aktív',jogimegjegyzes:S.pForm.jogimegjegyzes||'',hirsz:S.pForm.hirsz||'',fofoto,drive_linkek:(S.pForm.drive_linkek||[]).filter(l=>l),hirdetesi_linkek:(S.pForm.hirdetesi_linkek||[]).filter(l=>l),dokumentumok:S.pForm.dokumentumok||[],letrehozva:S.pForm.letrehozva||now()};
  const r=await db.upsert('megbizasok',data);
  S.saving=false;
  if(r.ok){
    await naplo(data.id,'megbizasok',isNew?'Megbízás létrehozva':'Módosítva');
    S.props=isNew?[data,...S.props]:S.props.map(p=>p.id===data.id?data:p);
    S.pCur=data.id;S.pForm=null;S.pView='detail';S.pTab='alap';S.teendok=[];S.erdeklodok=[];S.propNaplo=[];
    render();toast('✓ Mentve');loadPR(data.id);loadAll();
  }else toast('❌ '+r.error);
};

const delProp=async id=>{if(!confirm('Biztosan törlöd ezt a megbízást?'))return;await db.del('megbizasok',id);S.props=S.props.filter(p=>p.id!==id);S.pView='list';render();toast('✓ Törölve')};

// TASKS
const addTask=async()=>{const t={id:uid(),megbizas_id:S.pCur,szoveg:'',datum:'',kesz:false,letrehozva:now()};await db.upsert('teendok',t);S.teendok=[...S.teendok,t];S.taskEdits[t.id]={szoveg:'',datum:''};render()};
const toggleTask=async id=>{const t=S.teendok.find(t=>t.id===id);const u={...t,kesz:!t.kesz};await db.upsert('teendok',u);await naplo(S.pCur,'teendok',`${u.kesz?'✅ Kész':'🔄 Újranyitva'}: ${t.szoveg||'?'}`);S.teendok=S.teendok.map(x=>x.id===id?u:x);render()};
const setTE=(id,f,v)=>{if(!S.taskEdits[id])S.taskEdits[id]={};S.taskEdits[id][f]=v};
const saveTask=async id=>{const e=S.taskEdits[id]||{};const t=S.teendok.find(t=>t.id===id);const u={...t,...e};await db.upsert('teendok',u);await naplo(S.pCur,'teendok',`Teendő: ${u.szoveg||'?'}`);S.teendok=S.teendok.map(x=>x.id===id?u:x);delete S.taskEdits[id];render();toast('✓ Teendő mentve')};
const delTask=async id=>{await db.del('teendok',id);S.teendok=S.teendok.filter(t=>t.id!==id);render()};

// ÉRDEKLŐDŐK
const addErd=async()=>{const e={id:uid(),megbizas_id:S.pCur,nev:'',tel:'',email:'',megjegyzes:'',keres:'',letrehozva:now()};await db.upsert('erdeklodok',e);S.erdeklodok=[...S.erdeklodok,e];S.erdEdits[e.id]={};render()};
const setEE=(id,f,v)=>{if(!S.erdEdits[id])S.erdEdits[id]={};S.erdEdits[id][f]=v};
const saveErd=async id=>{const e=S.erdeklodok.find(e=>e.id===id);const u={...e,...(S.erdEdits[id]||{})};await db.upsert('erdeklodok',u);await naplo(S.pCur,'erdeklodok',`Érdeklődő: ${u.nev||'?'}`);S.erdeklodok=S.erdeklodok.map(x=>x.id===id?u:x);delete S.erdEdits[id];render();toast('✓ Mentve')};
const delErd=async id=>{await db.del('erdeklodok',id);S.erdeklodok=S.erdeklodok.filter(e=>e.id!==id);render()};
const createKerFromErd=async id=>{const e=S.erdeklodok.find(e=>e.id===id)||{};const m={...e,...(S.erdEdits[id]||{})};const k={id:uid(),ugyfel_nev:m.nev||'',ugyfel_tel:m.tel||'',ugyfel_email:m.email||'',referens:S.user,statusz:'Aktív',datum:new Date().toISOString().slice(0,10),tipus:'',altipus:'',helyszin:'',ar_tol:null,ar_ig:null,alap_tol:null,alap_ig:null,megjegyzes:m.keres||'',forrasprop_id:S.pCur,letrehozva:now()};await db.upsert('keresesi_megbizasok',k);await naplo(k.id,'keresesi_megbizasok',`Létrehozva érdeklődőből: ${m.nev||'?'}`);S.kers=[k,...S.kers];S.kCur=k.id;S.kView='detail';S.kTab='alap';S.kiajanlottak=[];S.kerNaplo=[];S.section='ker';render();toast('✓ Keresési megbízás létrehozva')};

// KER
const openKer=id=>{S.kCur=id;S.kView='detail';S.kTab='alap';S.kiajanlottak=[];S.kerNaplo=[];render();loadKR(id)};
const newKer=()=>{S.kForm={id:uid(),ugyfel_nev:'',ugyfel_tel:'',ugyfel_email:'',referens:S.user,statusz:'Aktív',datum:new Date().toISOString().slice(0,10),tipus:'',altipus:'',helyszin:'',ar_tol:'',ar_ig:'',alap_tol:'',alap_ig:'',megjegyzes:'',forrasprop_id:'',letrehozva:now()};S.kView='form';render()};
const editKer=()=>{const k=S.kers.find(x=>x.id===S.kCur);if(k){S.kForm={...k};S.kView='form';render()}};
const cancelKForm=()=>{const isNew=!S.kers.find(k=>k.id===S.kForm?.id);S.kForm=null;S.kView=isNew?'list':'detail';render()};
const refreshKer=async()=>{await loadAll();await loadKR(S.kCur);toast('🔄 Frissítve')};

const saveKer=async()=>{
  if(!S.kForm.ugyfel_nev?.trim()){toast('❌ Ügyfél neve kötelező!');return}
  S.saving=true;render();
  const isNew=!S.kers.find(k=>k.id===S.kForm.id);
  const data={id:S.kForm.id,ugyfel_nev:S.kForm.ugyfel_nev,ugyfel_tel:S.kForm.ugyfel_tel||'',ugyfel_email:S.kForm.ugyfel_email||'',referens:S.kForm.referens||'',statusz:S.kForm.statusz||'Aktív',datum:S.kForm.datum||null,tipus:S.kForm.tipus||'',altipus:S.kForm.altipus||'',helyszin:S.kForm.helyszin||'',ar_tol:S.kForm.ar_tol?Number(S.kForm.ar_tol):null,ar_ig:S.kForm.ar_ig?Number(S.kForm.ar_ig):null,alap_tol:S.kForm.alap_tol?Number(S.kForm.alap_tol):null,alap_ig:S.kForm.alap_ig?Number(S.kForm.alap_ig):null,megjegyzes:S.kForm.megjegyzes||'',forrasprop_id:S.kForm.forrasprop_id||'',letrehozva:S.kForm.letrehozva||now()};
  const r=await db.upsert('keresesi_megbizasok',data);
  S.saving=false;
  if(r.ok){
    await naplo(data.id,'keresesi_megbizasok',isNew?'Létrehozva':'Módosítva');
    S.kers=isNew?[data,...S.kers]:S.kers.map(k=>k.id===data.id?data:k);
    S.kCur=data.id;S.kForm=null;S.kView='detail';S.kTab='alap';S.kiajanlottak=[];S.kerNaplo=[];
    render();toast('✓ Mentve');loadKR(data.id);loadAll();
  }else toast('❌ '+r.error);
};

const delKer=async id=>{if(!confirm('Biztosan törlöd?'))return;await db.del('keresesi_megbizasok',id);S.kers=S.kers.filter(k=>k.id!==id);S.kView='list';render();toast('✓ Törölve')};

// KIAJÁNLOTTAK
const addKai=async()=>{const k={id:uid(),ker_id:S.kCur,tipus:'saját',prop_id:'',cim:'',link:'',kozvetito:'',jutalek:'',megjegyzes:'',datum:new Date().toISOString().slice(0,10),letrehozva:now()};await db.upsert('kiajanlottak',k);S.kiajanlottak=[...S.kiajanlottak,k];S.kaiEdits[k.id]={...k};render()};
const setKE=(id,f,v)=>{if(!S.kaiEdits[id])S.kaiEdits[id]={};S.kaiEdits[id][f]=v;render()};
const saveKai=async id=>{const ki=S.kiajanlottak.find(k=>k.id===id);const u={...ki,...(S.kaiEdits[id]||{})};await db.upsert('kiajanlottak',u);await naplo(S.kCur,'kiajanlottak',`Kiajánlott: ${u.tipus==='saját'?(S.props.find(p=>p.id===u.prop_id)?.cim||''):u.cim||'?'}`);S.kiajanlottak=S.kiajanlottak.map(x=>x.id===id?u:x);delete S.kaiEdits[id];render();toast('✓ Mentve')};
const delKai=async id=>{await db.del('kiajanlottak',id);S.kiajanlottak=S.kiajanlottak.filter(k=>k.id!==id);render()};

// INIT
render();
if(S.user)loadAll();
</script>
